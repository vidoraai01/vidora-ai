name: Validate Vidora AI preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ui/design-repair]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run project tests
        run: npm test

      - name: Validate Cloudflare Worker and static assets (dry run only)
        run: npx --yes wrangler@4.161.0 deploy --dry-run --outdir .wrangler/deploy --config wrangler.jsonc
